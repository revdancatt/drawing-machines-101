<html>
<head>
<title>my design</title>
<style>
  body {
    margin: 1rem;
  }
  .columns {
    display: flex;
    gap: 1rem;
    align-items: flex-start
  }
  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  canvas#preview {
    width: 100%;
  }
</style>
<script src="tools.js?v=2"></script>
</head>
<body>

<div class="columns">
  <div class="column" id="canvas_holder">
    <canvas id="preview"></canvas>
  </div>
  <div class="column" id="controls">
    Squares Across: <input id="squaresAcross" value="8">
    Squares Down: <input id="squaresDown" value="10">
    Square Size: <input id="squareSize" value="10">
    Square Gap: <input id="squareGap" value="5">
    <button id="update">Update</button>
    <button id="saveSVG">Save SVG</button>
    <button id="saveGCODE">Save GCODE</button>

  </div>
</div>

<script>

  let finalDesign = null

  const makeDesign = (pageWidth, pageHeight) => {

    // Set the size of everything!
    const squareSize = parseFloat(document.getElementById('squareSize').value)
    const squareGap = parseFloat(document.getElementById('squareGap').value)
    const squaresAcross = parseInt(document.getElementById('squaresAcross').value)
    const squaresDown = parseInt(document.getElementById('squaresDown').value)

    // Work out the size of the design
    const designWidth = (squaresAcross * squareSize) + ((squaresAcross - 1) * squareGap)
    const designHeight = (squaresDown * squareSize) + ((squaresDown - 1) * squareGap)

    // Figure out where we need to start, so the design in places in the
    // middle of the page
    const sideMargin = (pageWidth - designWidth) / 2
    const topMargin = (pageHeight - designHeight) / 2

    // This is where we store our design
    const allLines = []

    // The outer loop is the rows going down.
    for (let down = 0; down < squaresDown; down += 1) {
      // Work out where y lives for this row
      const y = topMargin + ((squareSize + squareGap) * down)
      // The inner loop is going across
      for (let across = 0; across < squaresAcross; across += 1) {
        // So we have to recalculate the x position each time
        const x = sideMargin + ((squareSize + squareGap) * across)

        // Make a line here
        const line = {
          layer: 0,
          stroke: true,
          fill: false,
          points: []
        }
        
        // Add all the points in a slightly shorter format
        line.points.push({x: x, y: y })
        line.points.push({x: x + squareSize, y: y})
        line.points.push({x: x + squareSize, y: y + squareSize})
        line.points.push({x: x, y: y + squareSize})
        line.points.push({x: x, y: y})

        allLines.push(line)

      }
    }

    return allLines
  }

  
  
  // Main function, does all the stuff we need.
  const main = (pageWidth, pageHeight) => {
    const almostFinalDesign = makeDesign(pageWidth, pageHeight)
    //   Add the margins
    finalDesign = addMargins(pageWidth, pageHeight, almostFinalDesign, 30)
    drawCanvas(pageWidth, pageHeight, finalDesign)

    // Set the update button
    document.getElementById('update').onclick = () => {
      finalDesign = makeDesign(pageWidth, pageHeight)
      drawCanvas(pageWidth, pageHeight, finalDesign)
    }

    // Set the save buttons up
    document.getElementById('saveSVG').onclick = () => {
      downloadSVG(pageWidth, pageHeight, finalDesign, 'lines')
    }

    document.getElementById('saveGCODE').onclick = () => {
      downloadGCODE(pageWidth, pageHeight, finalDesign, 'lines')
    }

  }

  // Kick it all off 
  main(210, 297)

</script>
</body>
</html>
