<html>
<head>
<title>my design</title>
<style>
  body {
    margin: 1rem;
  }
  .columns {
    display: flex;
    gap: 1rem;
    align-items: flex-start
  }
  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  canvas#preview {
    width: 100%;
  }
</style>
</head>
<body>

<div class="columns">
  <div class="column" id="canvas_holder">
    <canvas id="preview"></canvas>
  </div>
  <div class="column" id="controls">
    <textarea id="target" cols="80" rows="40"></textarea>
    <br>
    <button id="save">Save</button>
  </div>
</div>

<script>
  // This function deals with downloading the generated text
  // as an SVG file
  const download = (filename) => {
    var element = document.createElement('a')
    element.setAttribute('download', `${filename}.gcode`)
    element.style.display = 'none'
    document.body.appendChild(element)
    //  Blob code via gec @3Dgec https://twitter.com/3Dgec/status/1226018489862967297
    element.setAttribute('href', window.URL.createObjectURL(new Blob([document.getElementById('target').textContent], {
      type: 'text/plain;charset=utf-8'
    })))

    element.click()
    document.body.removeChild(element)
  }
  // Set the filename here
  document.getElementById('save').onclick = () => download('lines')
</script>

<script>

  // Set the width and height here to save time.
  const pageWidth = 210
  const pageHeight = 297

  // Set the size of everything!
  const squareSize = 15
  const squareGap = 5
  const squaresAcross = 8
  const squaresDown = 12

  // Work out the size of the design
  const designWidth = (squaresAcross * squareSize) + ((squaresAcross - 1) * squareGap)
  const designHeight = (squaresDown * squareSize) + ((squaresDown - 1) * squareGap)

  // Figure out where we need to start, so the design in places in the
  // middle of the page
  const sideMargin = (pageWidth - designWidth) / 2
  const topMargin = (pageHeight - designHeight) / 2

  // This is where we store our design
  const allLines = []

  // The outer loop is the rows going down.
  for (let down = 0; down < squaresDown; down += 1) {
    // Work out where y lives for this row
    const y = topMargin + ((squareSize + squareGap) * down)
    // The inner loop is going across
    for (let across = 0; across < squaresAcross; across += 1) {
      // So we have to recalculate the x position each time
      const x = sideMargin + ((squareSize + squareGap) * across)

      // Make a line here
      const line = {
        layer: 0,
        stroke: true,
        fill: false,
        points: []
      }
      
      // Add all the points in a slightly shorter format
      line.points.push({x: x, y: y })
      line.points.push({x: x + squareSize, y: y})
      line.points.push({x: x + squareSize, y: y + squareSize})
      line.points.push({x: x, y: y + squareSize})
      line.points.push({x: x, y: y})

      if (Math.random() < 0.66) {
        allLines.push(line)
      }

    }
  }

  console.log('\n')
  console.log('All Lines: ')
  console.log(allLines)
  console.log('\n')


  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  const scaleMod = 10
  const canvas = document.getElementById('preview')
  canvas.width = pageWidth * scaleMod
  canvas.height = pageHeight * scaleMod

  const ctx = canvas.getContext('2d')
  ctx.fillStyle = '#f6f6f6'
  ctx.fillRect(0, 0, canvas.width, canvas.height)

  ctx.lineWidth = canvas.width / 500
  ctx.strokeStyle = 'black'

  // Loop through all the lines
  for (let i = 0; i < allLines.length; i += 1) {
    // Grab the line
    const line = allLines[i]
    // Grab the points
    const points = line.points

    ctx.beginPath()
    ctx.moveTo(points[0].x * scaleMod, points[0].y * scaleMod)

    // Loop through all the rest of the points
    for (let j = 1; j < points.length; j ++) {
      const point = points[j]
      ctx.lineTo(point.x * scaleMod, point.y * scaleMod)
    }
    ctx.stroke()
  }

  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-
  // -=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-


  // Creates the head part of the SVG
  /*
  const head = `<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Created with Inkscape (http://www.inkscape.org/) -->

<svg
   width="${pageWidth}mm"
   height="${pageHeight}mm"
   viewBox="0 0 ${pageWidth} ${pageHeight}"
   version="1.1"
   id="svg1"
   inkscape:version="1.4.2 (ebf0e940, 2025-05-08)"
   sodipodi:docname="test.svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">

  <g
     inkscape:label="Layer 1"
     inkscape:groupmode="layer"
     id="layer1"
     style="fill:none;stroke:none"
   >

`
  // Creates the tail part of the SVG
  const tail = `
  </g>
</svg>`

  let body = ``

  // Loop through all the lines
  for (let i = 0; i < allLines.length; i += 1) {
    // Grab the line
    const line = allLines[i]
    // Grab the points
    const points = line.points
    
    // Make a new path
    let path = '<path style="'
    // Add the default style to each path, in this case a stroke
    path += 'stroke:#000000;stroke-width:0.2mm;'

    // Now start the path
    path += '" d="M '
    // Loop through all the points
    for (let j = 0; j < points.length; j ++) {
      const point = points[j]
      path += `${point.x},${point.y} `
    }
    path += '" />\n'

    // Add the path to the body
    body += path
  }

  */

  const head = `G10 L2 P1 X0 Y0 Z0
G10 L2 P6 X0 Y0 Z0
G90
G54
G1 Z15 F3000

( ## Install Black G2-0.7 )
( Park Height: 13.5 )
( AccelX:1000 )
( AccelY:1000 )
( AccelZ:1000 )
G53 G0 X0 Y0
G53 G1 Z13.5 F3000
M0
( CLEAR )
G53 G1 Z15 F3000

`
  // Creates the tail part of the SVG
  const tail = `
G53 G0 X0 Y0
M5
M2`

  let body = ``

  // Loop through all the lines
  for (let i = 0; i < allLines.length; i += 1) {
    // Grab the line
    const line = allLines[i]
    // Grab the points
    const points = line.points
    
    // Make a new path
    let path = `G0 X${points[0].x} Y${pageHeight - points[0].y}\n`
    path += 'G1 Z8 F3000\n'

    // Loop through all the points
    for (let j = 1; j < points.length; j ++) {
      const point = points[j]
      path += `G1 X${point.x} Y${pageHeight - point.y} F3000\n`
    }
    path += 'G1 Z15 F3000\n\n'

    // Add the path to the body
    body += path
  }
  // Put it all together into the target textarea
  document.getElementById('target').innerHTML = head + body + tail


</script>
</body>
</html>
